services:
    csa_guzzle.mock.storage:
        class: Csa\GuzzleHttp\Middleware\Cache\Adapter\MockStorageAdapter
        public: false
        arguments:
            - ~ # storagePath

    csa_guzzle.middleware.mock:
        class: Csa\GuzzleHttp\Middleware\Cache\MockMiddleware
        arguments:
            - '@csa_guzzle.mock.storage'
            - ~ # mode
            - ~ # debug
        tags:
            - { name: csa_guzzle.middleware, alias: mock, priority: -1250 }
